[package]
name = "tgow-overlay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "tgow-overlay"
path = "src/main.rs"

[dependencies]
tgow-common.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"
