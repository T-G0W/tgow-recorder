[package]
name = "tgow-rec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "tgow-rec"
path = "src/main.rs"

[dependencies]
tgow-common.workspace = true
anyhow.workspace = true
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
pipewire = "0.10"
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screencast"] }
futures-lite = "2"
libpulse-binding = "2.30"
x11rb = { version = "0.13", features = ["shm", "randr", "xfixes", "composite"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"
