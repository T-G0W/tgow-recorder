[workspace]
resolver = "2"
members = ["crates/common", "crates/recorder", "crates/daemon", "crates/overlay", "xtask"]
default-members = ["crates/common", "crates/recorder", "crates/daemon", "crates/overlay"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["T-GOW"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/T-G0W/tgow-recorder"

[workspace.dependencies]
tgow-common = { path = "crates/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
